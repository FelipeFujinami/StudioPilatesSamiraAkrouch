<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Aluno</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #EBE8E3; margin: 0; padding: 40px; }
        .wizard-container { background-color: #FFFFFF; padding: 35px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 750px; margin: 0 auto; }
        
        .progress-bar { display: flex; justify-content: space-around; margin-bottom: 30px; border-bottom: 2px solid #ccc; padding-bottom: 15px; }
        .step-indicator { font-weight: bold; color: #777; font-size: 14px; cursor: pointer; }
        .step-indicator.active { color: #C0392B; border-bottom: 2px solid #C0392B; padding-bottom: 15px; margin-bottom: -17px; }
        
        .form-step { display: none; }
        .form-step.active { display: block; }
        
        h2 { color: #333; margin-top: 0; margin-bottom: 20px; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        h3 { font-size: 16px; color: #C0392B; margin-top: 25px; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-col { flex: 1; }
        
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 13px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        
        .health-question { background-color: #F8F9FA; padding: 15px; border-radius: 6px; border: 1px solid #EAEAEA; margin-bottom: 15px; }
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-group label { display: inline; font-weight: normal; margin-left: 5px; cursor: pointer; }
        .qual-container { display: none; margin-top: 10px; }
        
        .actions-bar { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn { padding: 12px 25px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; text-decoration: none; border: none; }
        .btn-save { background-color: #27AE60; color: white; }
        .btn-cancel { background-color: transparent; color: #555; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div class="wizard-container">
        <div class="progress-bar">
            <span class="step-indicator active" id="ind-0" onclick="mudarAba(0)">1. Dados Pessoais</span>
            <span class="step-indicator" id="ind-1" onclick="mudarAba(1)">2. Histórico Médico</span>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-step active" id="step-0">
                <h2>Modificar Dados de: {{ aluno.first_name }}</h2>
                
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" name="nome_completo" required value="{{ aluno.first_name }} {{ aluno.last_name }}">
                </div>
                
                <div class="form-row">
                    <div class="form-col">
                        <label>Data de Nascimento</label>
                        <input type="text" name="data_nascimento" id="id_data_nascimento" maxlength="10" required oninput="mascaraData(this)" value="{{ data_nascimento_formatada }}">
                    </div>
                    <div class="form-col">
                        <label>Sexo</label>
                        <select name="sexo" required>
                            <option value="Masculino" {% if aluno.sexo == 'Masculino' %}selected{% endif %}>Masculino</option>
                            <option value="Feminino" {% if aluno.sexo == 'Feminino' %}selected{% endif %}>Feminino</option>
                            <option value="Não-binário" {% if aluno.sexo == 'Não-binário' %}selected{% endif %}>Não-binário</option>
                            <option value="Prefiro não responder" {% if aluno.sexo == 'Prefiro não responder' %}selected{% endif %}>Prefiro não responder</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col"><label>CPF</label><input type="text" name="cpf" required value="{{ aluno.cpf }}"></div>
                    <div class="form-col"><label>RG</label><input type="text" name="rg" required value="{{ aluno.rg }}"></div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label>Estado Civil</label>
                        <select name="estado_civil" required>
                            <option value="Solteiro(a)" {% if aluno.estado_civil == 'Solteiro(a)' %}selected{% endif %}>Solteiro(a)</option>
                            <option value="Casado(a)" {% if aluno.estado_civil == 'Casado(a)' %}selected{% endif %}>Casado(a)</option>
                            <option value="Divorciado(a)" {% if aluno.estado_civil == 'Divorciado(a)' %}selected{% endif %}>Divorciado(a)</option>
                            <option value="Viúvo(a)" {% if aluno.estado_civil == 'Viúvo(a)' %}selected{% endif %}>Viúvo(a)</option>
                        </select>
                    </div>
                    <div class="form-col"><label>Profissão</label><input type="text" name="profissao" required value="{{ aluno.profissao }}"></div>
                </div>

                <div class="form-row">
                    <div class="form-col"><label>Telefone</label><input type="text" name="telefone" required value="{{ aluno.telefone }}"></div>
                    <div class="form-col"><label>E-mail</label><input type="email" name="email" required value="{{ aluno.email }}"></div>
                </div>

                <div id="secao_responsavel" style="background-color: #FFF2F2; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #FCAAAA; display: {% if aluno.nome_responsavel %}block{% else %}none{% endif %};">
                    <h3 style="margin-top: 0;">Dados do Responsável Legal</h3>
                    <div class="form-row">
                        <div class="form-col"><label>Nome do Responsável</label><input type="text" name="nome_responsavel" id="id_nome_responsavel" value="{{ aluno.nome_responsavel }}"></div>
                        <div class="form-col"><label>Telefone do Responsável</label><input type="text" name="telefone_responsavel" id="id_telefone_responsavel" value="{{ aluno.telefone_responsavel }}"></div>
                    </div>
                </div>

                <h3>Endereço</h3>
                <div class="form-group" style="max-width: 200px;"><label>CEP</label><input type="text" name="cep" id="id_cep" maxlength="9" oninput="buscaCepAuto(this.value)" value="{{ aluno.cep }}"></div>
                <div class="form-group"><label>Endereço</label><input type="text" name="logradouro" id="id_logradouro" required value="{{ aluno.logradouro }}"></div>
                <div class="form-row">
                    <div class="form-col" style="max-width: 150px;"><label>Número</label><input type="text" name="numero" id="id_numero" required value="{{ aluno.numero }}"></div>
                    <div class="form-col"><label>Complemento</label><input type="text" name="complemento" value="{{ aluno.complemento|default_if_none:'' }}"></div>
                </div>
                <div class="form-group"><label>Bairro</label><input type="text" name="bairro" id="id_bairro" required value="{{ aluno.bairro }}"></div>
                <div class="form-row">
                    <div class="form-col" style="max-width: 100px;"><label>UF</label><input type="text" name="uf" id="id_uf" required value="{{ aluno.uf }}"></div>
                    <div class="form-col"><label>Município</label><input type="text" name="cidade" id="id_cidade" required value="{{ aluno.cidade }}"></div>
                </div>

                <h3>Configuração do Contrato</h3>
                <div class="form-row">
                    <div class="form-col">
                        <label>Plano</label>
                        <select name="plano" required>
                            <option value="mensal" {% if aluno.plano == 'mensal' %}selected{% endif %}>Mensal</option>
                            <option value="trimestral" {% if aluno.plano == 'trimestral' %}selected{% endif %}>Trimestral</option>
                            <option value="anual" {% if aluno.plano == 'anual' %}selected{% endif %}>Anual</option>
                        </select>
                    </div>
                    <div class="form-col">
                        <label>Frequência</label>
                        <select name="dias_por_semana" required>
                            <option value="1x" {% if aluno.dias_por_semana == '1x' %}selected{% endif %}>1x na semana</option>
                            <option value="2x" {% if aluno.dias_por_semana == '2x' %}selected{% endif %}>2x na semana</option>
                            <option value="3x" {% if aluno.dias_por_semana == '3x' %}selected{% endif %}>3x na semana</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-step" id="step-1">
                <h2>Atualizar Informações de Saúde</h2>
                
                <div class="health-question">
                    <label style="font-size: 14px;">Possui alguma doença?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="possui_doenca" id="possui_doenca_sim" value="sim" {% if aluno.possui_doenca %}checked{% endif %} onclick="toggleSaudeQual('possui_doenca', 'qual_doenca')"><label for="possui_doenca_sim">Sim</label></div>
                        <div><input type="radio" name="possui_doenca" id="possui_doenca_nao" value="nao" {% if not aluno.possui_doenca %}checked{% endif %} onclick="toggleSaudeQual('possui_doenca', 'qual_doenca')"><label for="possui_doenca_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="qual_doenca_box" style="display: {% if aluno.possui_doenca %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="qual_doenca" id="qual_doenca" value="{{ aluno.qual_doenca|default_if_none:'' }}">
                    </div>
                </div>

                <div class="health-question">
                    <label style="font-size: 14px;">Já realizou cirurgias?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="fez_cirurgia" id="fez_cirurgia_sim" value="sim" {% if aluno.fez_cirurgia %}checked{% endif %} onclick="toggleSaudeQual('fez_cirurgia', 'qual_cirurgia')"><label for="fez_cirurgia_sim">Sim</label></div>
                        <div><input type="radio" name="fez_cirurgia" id="fez_cirurgia_nao" value="nao" {% if not aluno.fez_cirurgia %}checked{% endif %} onclick="toggleSaudeQual('fez_cirurgia', 'qual_cirurgia')"><label for="fez_cirurgia_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="qual_cirurgia_box" style="display: {% if aluno.fez_cirurgia %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="qual_cirurgia" id="qual_cirurgia" value="{{ aluno.qual_cirurgia|default_if_none:'' }}">
                    </div>
                </div>

                <div class="health-question">
                    <label style="font-size: 14px;">Faz tratamento médico atualmente?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="faz_tratamento" id="faz_tratamento_sim" value="sim" {% if aluno.faz_tratamento %}checked{% endif %} onclick="toggleSaudeQual('faz_tratamento', 'qual_tratamento')"><label for="faz_tratamento_sim">Sim</label></div>
                        <div><input type="radio" name="faz_tratamento" id="faz_tratamento_nao" value="nao" {% if not aluno.faz_tratamento %}checked{% endif %} onclick="toggleSaudeQual('faz_tratamento', 'qual_tratamento')"><label for="faz_tratamento_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="qual_tratamento_box" style="display: {% if aluno.faz_tratamento %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="qual_tratamento" id="qual_tratamento" value="{{ aluno.qual_tratamento|default_if_none:'' }}">
                    </div>
                </div>

                <div class="health-question">
                    <label style="font-size: 14px;">Possui dores frequentes?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="dores_frequentes" id="dores_frequentes_sim" value="sim" {% if aluno.dores_frequentes %}checked{% endif %} onclick="toggleSaudeQual('dores_frequentes', 'quais_dores')"><label for="dores_frequentes_sim">Sim</label></div>
                        <div><input type="radio" name="dores_frequentes" id="dores_frequentes_nao" value="nao" {% if not aluno.dores_frequentes %}checked{% endif %} onclick="toggleSaudeQual('dores_frequentes', 'quais_dores')"><label for="dores_frequentes_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="quais_dores_box" style="display: {% if aluno.dores_frequentes %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="quais_dores" id="quais_dores" value="{{ aluno.quais_dores|default_if_none:'' }}">
                    </div>
                </div>

                <div class="health-question">
                    <label style="font-size: 14px;">Problemas de coluna?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="problemas_coluna" id="problemas_coluna_sim" value="sim" {% if aluno.problemas_coluna %}checked{% endif %} onclick="toggleSaudeQual('problemas_coluna', 'quais_problemas_coluna')"><label for="problemas_coluna_sim">Sim</label></div>
                        <div><input type="radio" name="problemas_coluna" id="problemas_coluna_nao" value="nao" {% if not aluno.problemas_coluna %}checked{% endif %} onclick="toggleSaudeQual('problemas_coluna', 'quais_problemas_coluna')"><label for="problemas_coluna_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="quais_problemas_coluna_box" style="display: {% if aluno.problemas_coluna %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="quais_problemas_coluna" id="quais_problemas_coluna" value="{{ aluno.quais_problemas_coluna|default_if_none:'' }}">
                    </div>
                </div>

                <div class="health-question">
                    <label style="font-size: 14px;">Hérnia de disco?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="hernia_disco" id="hernia_disco_sim" value="sim" {% if aluno.hernia_disco %}checked{% endif %} onclick="toggleSaudeQual('hernia_disco', 'descricao_hernia')"><label for="hernia_disco_sim">Sim</label></div>
                        <div><input type="radio" name="hernia_disco" id="hernia_disco_nao" value="nao" {% if not aluno.hernia_disco %}checked{% endif %} onclick="toggleSaudeQual('hernia_disco', 'descricao_hernia')"><label for="hernia_disco_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="descricao_hernia_box" style="display: {% if aluno.hernia_disco %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="descricao_hernia" id="descricao_hernia" value="{{ aluno.descricao_hernia|default_if_none:'' }}">
                    </div>
                </div>

                <div class="health-question">
                    <label style="font-size: 14px;">Problemas cardíacos?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="problemas_cardiacos" id="problemas_cardiacos_sim" value="sim" {% if aluno.problemas_cardiacos %}checked{% endif %} onclick="toggleSaudeQual('problemas_cardiacos', 'descricao_problemas_cardiacos')"><label for="problemas_cardiacos_sim">Sim</label></div>
                        <div><input type="radio" name="problemas_cardiacos" id="problemas_cardiacos_nao" value="nao" {% if not aluno.problemas_cardiacos %}checked{% endif %} onclick="toggleSaudeQual('problemas_cardiacos', 'descricao_problemas_cardiacos')"><label for="problemas_cardiacos_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="descricao_problemas_cardiacos_box" style="display: {% if aluno.problemas_cardiacos %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="descricao_problemas_cardiacos" id="descricao_problemas_cardiacos" value="{{ aluno.descricao_problemas_cardiacos|default_if_none:'' }}">
                    </div>
                </div>

                <div class="health-question">
                    <label style="font-size: 14px;">Hipertensão?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="hipertensao" id="hipertensao_sim" value="sim" {% if aluno.hipertensao %}checked{% endif %} onclick="toggleSaudeQual('hipertensao', 'qual_hipertensao')"><label for="hipertensao_sim">Sim</label></div>
                        <div><input type="radio" name="hipertensao" id="hipertensao_nao" value="nao" {% if not aluno.hipertensao %}checked{% endif %} onclick="toggleSaudeQual('hipertensao', 'qual_hipertensao')"><label for="hipertensao_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="qual_hipertensao_box" style="display: {% if aluno.hipertensao %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="qual_hipertensao" id="qual_hipertensao" value="{{ aluno.qual_hipertensao|default_if_none:'' }}">
                    </div>
                </div>

                <div class="health-question">
                    <label style="font-size: 14px;">Diabetes?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="diabetes" id="diabetes_sim" value="sim" {% if aluno.diabetes %}checked{% endif %} onclick="toggleSaudeQual('diabetes', 'qual_diabete')"><label for="diabetes_sim">Sim</label></div>
                        <div><input type="radio" name="diabetes" id="diabetes_nao" value="nao" {% if not aluno.diabetes %}checked{% endif %} onclick="toggleSaudeQual('diabetes', 'qual_diabete')"><label for="diabetes_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="qual_diabete_box" style="display: {% if aluno.diabetes %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="qual_diabete" id="qual_diabete" value="{{ aluno.qual_diabete|default_if_none:'' }}">
                    </div>
                </div>

                <div class="health-question">
                    <label style="font-size: 14px;">Osteoporose?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="osteoporose" id="osteoporose_sim" value="sim" {% if aluno.osteoporose %}checked{% endif %} onclick="toggleSaudeQual('osteoporose', 'qual_osteoporose')"><label for="osteoporose_sim">Sim</label></div>
                        <div><input type="radio" name="osteoporose" id="osteoporose_nao" value="nao" {% if not aluno.osteoporose %}checked{% endif %} onclick="toggleSaudeQual('osteoporose', 'qual_osteoporose')"><label for="osteoporose_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="qual_osteoporose_box" style="display: {% if aluno.osteoporose %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="qual_osteoporose" id="qual_osteoporose" value="{{ aluno.qual_osteoporose|default_if_none:'' }}">
                    </div>
                </div>

                <div class="health-question">
                    <label style="font-size: 14px;">Labirintite?</label>
                    <div class="radio-group">
                        <div><input type="radio" name="labirintite" id="labirintite_sim" value="sim" {% if aluno.labirintite %}checked{% endif %} onclick="toggleSaudeQual('labirintite', 'qual_labirintite')"><label for="labirintite_sim">Sim</label></div>
                        <div><input type="radio" name="labirintite" id="labirintite_nao" value="nao" {% if not aluno.labirintite %}checked{% endif %} onclick="toggleSaudeQual('labirintite', 'qual_labirintite')"><label for="labirintite_nao">Não</label></div>
                    </div>
                    <div class="qual-container" id="qual_labirintite_box" style="display: {% if aluno.labirintite %}block{% else %}none{% endif %};">
                        <label>Qual? Descreva:</label>
                        <input type="text" name="qual_labirintite" id="qual_labirintite" value="{{ aluno.qual_labirintite|default_if_none:'' }}">
                    </div>
                </div>
                
            </div>

            <div class="actions-bar">
                <a href="{% url 'ver_aluno' aluno.id %}" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-save">Salvar Alterações</button>
            </div>
        </form>
    </div>

    <script>
        function mudarAba(indice) {
            document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active'));
            document.querySelectorAll('.step-indicator').forEach(ind => ind.classList.remove('active'));
            
            document.getElementById(`step-${indice}`).classList.add('active');
            document.getElementById(`ind-${indice}`).classList.add('active');
        }

        function toggleSaudeQual(radioName, inputName) {
            const radioSim = document.getElementById(`${radioName}_sim`);
            const boxQual = document.getElementById(`${inputName}_box`);
            const inputQual = document.getElementById(inputName);

            if (radioSim.checked) {
                boxQual.style.display = 'block';
                inputQual.required = true;
            } else {
                boxQual.style.display = 'none';
                inputQual.required = false;
                inputQual.value = '';
            }
        }

        function mascaraData(input) {
            let v = input.value.replace(/\D/g, "");
            let f = "";
            if (v.length > 0) {
                f += v.substring(0, 2);
                if (v.length > 2) {
                    f += "/" + v.substring(2, 4);
                    if (v.length > 4) {
                        f += "/" + v.substring(4, 8);
                    }
                }
            }
            input.value = f;
        }

        function buscaCepAuto(valor) {
            let cep = valor.replace(/\D/g, '');
            if (cep.length === 8) {
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                    .then(response => response.json())
                    .then(data => {
                        if (!data.erro) {
                            document.getElementById('id_logradouro').value = data.logradouro;
                            document.getElementById('id_bairro').value = data.bairro;
                            document.getElementById('id_cidade').value = data.localidade;
                            document.getElementById('id_uf').value = data.uf;
                            document.getElementById('id_numero').focus();
                        }
                    });
            }
        }
    </script>
</body>
</html>
